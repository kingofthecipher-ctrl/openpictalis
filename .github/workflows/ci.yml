name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -c "import json; json.load(open('openpictalis/catalog.json'))"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv .build/installed
      - run: .build/installed/bin/python -m pip install --no-deps dist/*.whl
      - name: Check installed package outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/installed/bin/python" -c 'from openpictalis import server; assert server.catalog()["models"]; assert (server.WEB / "index.html").is_file(); assert (server.WEB / "assets/logo.svg").is_file(); assert (server.WEB / "assets/fonts/BricolageGrotesque.woff2").is_file(); assert (server.WEB / "assets/fonts/OFL-IBMPlexMono.txt").is_file()'
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: bash macos/build-app.sh
